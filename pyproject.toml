[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "spotify-wrapped-mcp"
version = "0.1.0"
description = "Read-only Spotify MCP server: search, lookup, library, listening history, and monthly-wrapped aggregations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "borystam" }]
keywords = ["mcp", "spotify", "wrapped", "analytics", "claude", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "syrupy>=4.6",
    "respx>=0.21",
    "ruff>=0.6",
    "black>=24.4",
    "mypy>=1.10",
    "isort>=5.13",
    "pre-commit>=3.7",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/borystam/spotify-wrapped-mcp"
Repository = "https://github.com/borystam/spotify-wrapped-mcp"
Issues = "https://github.com/borystam/spotify-wrapped-mcp/issues"
Changelog = "https://github.com/borystam/spotify-wrapped-mcp/blob/main/CHANGELOG.md"

[project.scripts]
spotify-wrapped-mcp = "spotify_wrapped_mcp.cli.main:main"
spotify-wrapped-mcp-auth = "spotify_wrapped_mcp.cli.auth:main"
spotify-history-poller = "spotify_wrapped_mcp.cli.poller:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_wrapped_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PL",   # pylint
    "PT",   # pytest-style
]
ignore = [
    "E501",    # line length handled by formatter
    "PLR2004", # magic numbers
    "PLR0913", # too many args; PKCE / API surface needs them
    "PLC0415", # imports inside functions OK (tests, conditional imports)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]  # broad pytest.raises ok in tests

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]
known_first_party = ["spotify_wrapped_mcp"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_decorators = false
warn_unused_ignores = true
warn_return_any = true
files = ["src/spotify_wrapped_mcp"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: marks tests that hit the real Spotify API (gated by SPOTIFY_INTEGRATION_TESTS=1)",
]

[tool.coverage.run]
branch = true
source = ["src/spotify_wrapped_mcp"]
omit = [
    "src/spotify_wrapped_mcp/__main__.py",
    "src/spotify_wrapped_mcp/cli/poller.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
