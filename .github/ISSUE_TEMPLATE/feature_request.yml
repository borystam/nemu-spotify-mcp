name: Feature request
description: Propose a new read-only Spotify tool, aggregation, or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Reminder: this server is **read-only**. Playback-control requests
        will be closed — please open them against a playback-focused MCP
        (e.g. marcelmarais/spotify-mcp) instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Tool name, signature, expected output shape, example input.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
